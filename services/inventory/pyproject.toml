[project]
name = "flashsale"
version = "0.1.0"
description = "Flash sale application"
requires-python = ">=3.11,<4.0"
dependencies = [
  "fastapi",
  "uvicorn",
  "psycopg[binary]>=3.3.2,<4.0.0",
  "pydantic",
  "redis>=5.0.0,<6.0.0",
  "kafka-python>=2.0.2,<3.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov"
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
